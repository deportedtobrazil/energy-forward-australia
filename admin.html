<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Forward Australia | Admin</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.65), transparent 48%),
          linear-gradient(180deg, #e8f3ec 0%, #eef3f7 55%, #e2ecf5 100%);
        color: #0c1c2c;
      }

      .card {
        width: min(100%, 38rem);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.84);
        border-radius: 22px;
        padding: 1.35rem;
        box-shadow: 0 20px 44px rgba(12, 28, 44, 0.16);
        backdrop-filter: blur(10px);
        animation: card-enter 0.6s ease both;
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #bccfdf;
        border-radius: 10px;
        font-size: 1rem;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 0.8rem 1rem;
        background: #1f7a2f;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      button:hover,
      button:focus-visible {
        background: #175c23;
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(31, 122, 47, 0.35);
      }

      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        button {
          animation: none;
          transition: none;
        }
      }

      .error {
        color: #b42318;
        margin-top: 0.75rem;
      }

      .signers-list {
        display: grid;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .signers-list li {
        border: 1px solid #d8e8dc;
        border-radius: 12px;
        padding: 0.65rem 0.75rem;
        background: #f7fbf8;
      }

      .admin-heading-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.4rem;
      }

      .signers-meta {
        margin: 0 0 0.85rem;
        font-size: 0.95rem;
      }

      .signers-loading {
        margin-top: 0;
        margin-bottom: 0.85rem;
      }

      .ghost-button {
        width: auto;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        background: #fff;
        color: #175c23;
        border: 1px solid #b8d8bf;
      }

      .ghost-button:hover,
      .ghost-button:focus-visible {
        background: #eff9f1;
        box-shadow: 0 6px 14px rgba(31, 122, 47, 0.2);
      }

      .muted {
        color: #35506a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section id="login-section" aria-labelledby="admin-login-heading">
        <h1 id="admin-login-heading">Admin Login</h1>
        <p class="muted">Enter your admin credentials.</p>
        <form id="admin-login-form" novalidate>
          <div>
            <label for="admin-username">Username</label>
            <input id="admin-username" name="username" type="text" autocomplete="username" required />
          </div>
          <div>
            <label for="admin-password">Password</label>
            <input
              id="admin-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit">Log in</button>
        </form>
        <p id="login-error" class="error" role="alert" hidden>Invalid username or password.</p>
      </section>

      <section id="admin-section" aria-labelledby="admin-signers-heading" hidden>
        <div class="admin-heading-row">
          <h1 id="admin-signers-heading">Petition signatures</h1>
          <button
            id="refresh-signers"
            type="button"
            class="ghost-button"
            aria-label="Refresh petition signatures"
          >
            Refresh
          </button>
        </div>
        <p id="signers-meta" class="muted signers-meta" hidden></p>
        <p id="signers-loading" class="muted signers-loading" role="status" aria-live="polite" hidden>
          Loading signatures…
        </p>
        <p id="signers-empty" class="muted" role="status" hidden>No signatures have been submitted yet.</p>
        <p id="signers-error" class="error" role="alert" hidden>
          Could not load signatures. Please try again later.
        </p>
        <ul id="signers-list" class="signers-list" aria-live="polite"></ul>
      </section>
    </main>

    <script>
      const loginForm = document.getElementById("admin-login-form");
      const loginSection = document.getElementById("login-section");
      const adminSection = document.getElementById("admin-section");
      const loginError = document.getElementById("login-error");
      const signersList = document.getElementById("signers-list");
      const signersEmpty = document.getElementById("signers-empty");
      const signersError = document.getElementById("signers-error");
      const signersMeta = document.getElementById("signers-meta");
      const signersLoading = document.getElementById("signers-loading");
      const refreshSignersButton = document.getElementById("refresh-signers");
      const signaturesApiCandidates = [
        "https://script.google.com/macros/s/AKfycbyOmHf5-SqWVMalF4YMaZ9kRMBKGmI8qxb66G-aL0ojaliEncTNKmAifM6uDO_hO4mY/exec",
      ];
      const adminUsername = "periwenis";
      const adminPasswordHash =
        "c1ea006c2833e5bd21a43eb93df8410bcd9737b11fd1d8ca17d1d52bdba16330";
      const adminPasswordSalt = "energy-forward-australia-admin";
      const adminPasswordIterations = 600000;

      const toSignerName = (value) => {
        if (!value || typeof value !== "object") {
          return "";
        }
        if (typeof value.fullName === "string") {
          return value.fullName.trim();
        }
        if (typeof value.name === "string") {
          return value.name.trim();
        }
        return "";
      };

      const getSignerNames = async () => {
        let lastError = null;
        for (const endpoint of signaturesApiCandidates) {
          try {
            const response = await fetch(endpoint, {
              method: "GET",
              mode: "cors",
              credentials: "omit",
              cache: "no-store",
            });

            if (!response.ok) {
              if (response.status === 404) {
                lastError = new Error("Signature endpoint was not found.");
                continue;
              }
              if (response.status >= 500) {
                lastError = new Error("The server is unavailable right now.");
                continue;
              }
              throw new Error(`Could not fetch signatures (HTTP ${response.status}).`);
            }

            const payload = await response.json();
            const signatures = Array.isArray(payload.signatures) ? payload.signatures : [];
            const seenNames = new Set();
            const uniqueNames = [];
            for (const signer of signatures) {
              const name = toSignerName(signer);
              if (name && !seenNames.has(name)) {
                seenNames.add(name);
                uniqueNames.push(name);
              }
            }
            return uniqueNames;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("Could not load signatures from the API.");
      };

      const renderSignerNames = async () => {
        signersError.hidden = true;
        signersEmpty.hidden = true;
        signersLoading.hidden = false;
        signersMeta.hidden = true;
        signersList.textContent = "";
        refreshSignersButton.disabled = true;
        let names = [];

        try {
          names = await getSignerNames();
        } catch (error) {
          console.error("Could not load signer names:", error);
          signersError.hidden = false;
          signersLoading.hidden = true;
          refreshSignersButton.disabled = false;
          return;
        }

        signersLoading.hidden = true;
        refreshSignersButton.disabled = false;
        if (names.length === 0) {
          signersMeta.hidden = false;
          signersMeta.textContent = "0 signatures available.";
          signersEmpty.hidden = false;
          return;
        }

        signersMeta.hidden = false;
        signersMeta.textContent = `${names.length} signatures loaded from the live API.`;
        signersEmpty.hidden = true;
        const fragment = document.createDocumentFragment();
        for (let index = names.length - 1; index >= 0; index -= 1) {
          const listItem = document.createElement("li");
          listItem.textContent = names[index];
          fragment.appendChild(listItem);
        }
        signersList.appendChild(fragment);
      };

      const hashPassword = async (value) => {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error("Secure password hashing is not available in this browser.");
        }
        const encodedPassword = new TextEncoder().encode(value);
        const encodedSalt = new TextEncoder().encode(adminPasswordSalt);
        const importedPassword = await window.crypto.subtle.importKey(
          "raw",
          encodedPassword,
          "PBKDF2",
          false,
          ["deriveBits"]
        );
        const derivedBits = await window.crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            hash: "SHA-256",
            salt: encodedSalt,
            iterations: adminPasswordIterations,
          },
          importedPassword,
          256
        );
        return Array.from(new Uint8Array(derivedBits))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      };

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(loginForm);
        const username = String(formData.get("username") || "");
        const password = String(formData.get("password") || "");
        let passwordHash;

        try {
          passwordHash = await hashPassword(password);
        } catch (error) {
          console.error("Could not verify admin password:", error);
          loginError.hidden = false;
          return;
        }

        if (username === adminUsername && passwordHash === adminPasswordHash) {
          loginError.hidden = true;
          loginSection.hidden = true;
          adminSection.hidden = false;
          renderSignerNames();
          return;
        }

        loginError.hidden = false;
      });

      refreshSignersButton.addEventListener("click", () => {
        renderSignerNames();
      });
    </script>
  </body>
</html>
