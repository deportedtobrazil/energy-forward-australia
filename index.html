<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Forward Australia | Petition</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="petition-page">
      <section class="petition-card" aria-labelledby="petition-heading">
        <h1 id="petition-heading">Sign the Energy Forward Australia Petition</h1>
        <p>
          Join Australians calling for a clean energy transition by 2035. Add your
          name to support affordable, reliable, and sustainable power for every
          community.
        </p>

        <form class="petition-form" action="#" method="post">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full-name" type="text" required />

          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required />

          <button type="submit">Sign the Petition</button>
        </form>

        <p class="petition-goal">
          Goal: 50,000 signatures in support of clean energy by 2035.
        </p>
      </section>
    </main>
  </body>
</html>
