<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Forward Australia | Donations</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="petition-page">
      <section class="petition-card" aria-labelledby="donation-heading">
        <nav class="page-tabs" aria-label="Primary">
          <a class="page-tab" href="index.html">Petition</a>
          <a class="page-tab" href="our-mission.html">Our Mission</a>
          <a class="page-tab" href="donations.html" aria-current="page">Donate</a>
        </nav>
        <h1 id="donation-heading">Support Energy Forward Australia</h1>
        <p>
          Choose a donation amount to help us keep building support for clean,
          affordable, and reliable energy across Australia.
        </p>

        <form class="petition-form donation-form" id="donation-form">
          <fieldset class="donation-options">
            <legend>Select an amount</legend>

            <label class="donation-option" for="donation-10">
              <input id="donation-10" name="donation-amount" type="radio" value="10" checked />
              <span>$10</span>
            </label>
            <label class="donation-option" for="donation-20">
              <input id="donation-20" name="donation-amount" type="radio" value="20" />
              <span>$20</span>
            </label>
            <label class="donation-option" for="donation-50">
              <input id="donation-50" name="donation-amount" type="radio" value="50" />
              <span>$50</span>
            </label>
            <label class="donation-option" for="donation-100">
              <input id="donation-100" name="donation-amount" type="radio" value="100" />
              <span>$100</span>
            </label>
            <label class="donation-option" for="donation-200">
              <input id="donation-200" name="donation-amount" type="radio" value="200" />
              <span>$200</span>
            </label>
            <label class="donation-option" for="donation-500">
              <input id="donation-500" name="donation-amount" type="radio" value="500" />
              <span>$500</span>
            </label>
          </fieldset>

          <button id="pay-button" type="submit" class="status-button">Pay Now</button>
          <p id="payment-status" class="status-notice" role="alert" aria-live="assertive"></p>
        </form>

        <div class="page-actions">
          <a class="return-link" href="index.html">Back to the petition</a>
          <a class="return-link" href="our-mission.html">Read our mission</a>
        </div>
      </section>
    </main>
    <script>
      const donationForm = document.getElementById("donation-form");
      const payButton = document.getElementById("pay-button");
      const paymentStatus = document.getElementById("payment-status");

      donationForm.addEventListener("submit", (event) => {
        event.preventDefault();
        payButton.disabled = true;
        payButton.textContent = "Loading...";
        paymentStatus.textContent = "";
        paymentStatus.className = "status-notice";

        window.setTimeout(() => {
          payButton.disabled = false;
          payButton.textContent = "Pay Now";
          paymentStatus.className = "status-notice error-notice";
          paymentStatus.textContent =
            "We apologise, but our payment system is currently unavailable. Please try again later.";
        }, 5000);
      });
    </script>
  </body>
</html>
